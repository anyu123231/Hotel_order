<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>酒店客房在线点单</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- 微信 X5 浏览器优化 -->
    <meta name="x5-page-mode" content="app">
    <meta name="x5-fullscreen" content="true">
    <meta name="full-screen" content="yes">
    
    <!-- 禁用电话和邮箱识别（微信优化） -->
    <meta name="format-detection" content="telephone=no, email=no" />
    <!-- Ant Design 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5/dist/reset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5/dist/antd.min.css" />
    
    <!-- DNS 预解析加速（微信优化） -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px 16px 96px;
      }
      .page-shell {
        background: rgba(255, 255, 255, 0.96);
        border-radius: 24px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.28);
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }
      .hero {
        background-image: url('https://images.pexels.com/photos/237371/pexels-photo-237371.jpeg?auto=compress&cs=tinysrgb&w=1200');
        background-size: cover;
        background-position: center;
        position: relative;
        min-height: 160px;
      }
      .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.5));
      }
      .hero-content {
        position: relative;
        padding: 24px 24px 16px;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .hero-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f9fafb;
      }
      .hero-subtitle {
        font-size: 14px;
        color: #cbd5f5;
      }
      .hero-badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.1);
        color: #a5f3fc;
        font-size: 12px;
      }
      .hero-badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #22c55e;
        margin-right: 6px;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3);
      }
      .hero-illustration {
        width: 120px;
        height: 120px;
        background: radial-gradient(circle at 30% 20%, #22c55e, transparent 55%),
          radial-gradient(circle at 70% 80%, #0ea5e9, transparent 55%);
        border-radius: 32px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f9fafb;
        font-weight: 600;
        font-size: 18px;
      }
      .content-inner {
        padding: 20px 24px 24px;
      }
      .category-title {
        margin-top: 16px;
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: 600;
      }
      .item-grid {
        margin-bottom: 8px;
      }
      .cart-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 16px 18px;
        background: radial-gradient(circle at top, rgba(148, 163, 184, 0.3), transparent 52%),
          linear-gradient(to top, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.9));
        box-shadow: 0 -16px 32px rgba(15, 23, 42, 0.9);
        z-index: 50;
      }
      .cart-bar-inner {
        max-width: 1080px;
        margin: 0 auto;
      }
      @media (max-width: 768px) {
        .hero {
          min-height: 140px;
        }
        .hero-content {
          flex-direction: column;
          align-items: flex-start;
        }
        .hero-illustration {
          width: 96px;
          height: 96px;
        }
        .content-inner {
          padding-inline: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel 编译 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- dayjs（Ant Design 5 依赖） -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

    <!-- Ant Design & Axios -->
    <script src="https://cdn.jsdelivr.net/npm/antd@5/dist/antd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>

    <!-- 业务脚本拆分到多个文件 -->
    <script type="text/babel" src="./auth.jsx"></script>
    <script type="text/babel" src="./order.jsx"></script>
    <script type="text/babel" src="./profile.jsx"></script>

    <script type="text/babel">
      const { ConfigProvider, Layout, Typography, Space, Button, Avatar } = antd;
      const API_BASE = `${window.location.protocol}//${window.location.host}`;

      function useQuery() {
        const [query, setQuery] = React.useState({});
        React.useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const obj = {};
          params.forEach((value, key) => {
            obj[key] = value;
          });
          setQuery(obj);
        }, []);
        return query;
      }

      function AppShell() {
        const query = useQuery();
        const [user, setUser] = React.useState(null);
        const [view, setView] = React.useState('order'); // order | profile

        // 记录用户已访问过首页，用于其它页面（如管理端）做首次访问跳转控制
        React.useEffect(() => {
          try {
            localStorage.setItem('hasVisitedMain', '1');
          } catch (e) {
            // 忽略本地存储异常
          }
        }, []);

        const handleLogout = () => {
          setUser(null);
          setView('order');
        };

        if (!user) {
          return (
            <ConfigProvider
              theme={{
                token: {
                  colorPrimary: '#1677ff',
                  borderRadius: 8
                }
              }}
            >
              <Layout style={{ minHeight: '100vh', background: '#0f172a' }}>
                <Layout.Content style={{ padding: '8px' }}>
                  <div
                    style={{
                      maxWidth: 1080,
                      margin: '0 auto 8px',
                      display: 'flex',
                      justifyContent: 'flex-end'
                    }}
                  >
                    <Button
                      size="small"
                      type="default"
                      onClick={() => {
                        window.location.href = '/admin.html';
                      }}
                    >
                      管理员登录
                    </Button>
                  </div>
                  <div className="page-shell">
                    <div className="hero">
                      <div className="hero-overlay"></div>
                      <div className="hero-content">
                        <div>
                          <div className="hero-badge">
                            <span className="hero-badge-dot" />
                            欢迎使用客房在线点单
                          </div>
                          <div style={{ marginTop: 12 }}>
                            <div className="hero-title">Guest Portal</div>
                            <div className="hero-subtitle">登录后即可享受专属客房服务</div>
                          </div>
                        </div>
                        <div className="hero-illustration">
                          <div style={{ textAlign: 'center', lineHeight: 1.4 }}>
                            <div>LOGIN</div>
                            <div style={{ fontSize: 13, opacity: 0.9 }}>Welcome</div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="content-inner">
                      <AuthView
                        API_BASE={API_BASE}
                        onAuthed={(u) => {
                          setUser(u);
                        }}
                      />
                    </div>
                  </div>
                </Layout.Content>
              </Layout>
            </ConfigProvider>
          );
        }

        const initial = (user.username || '?').charAt(0).toUpperCase();

        return (
          <ConfigProvider
            theme={{
              token: {
                colorPrimary: '#1677ff',
                borderRadius: 8
              }
            }}
          >
            <Layout style={{ minHeight: '100vh', background: '#0f172a' }}>
              <Layout.Header
                style={{
                  background: 'transparent',
                  border: 'none',
                  paddingInline: 0,
                  maxWidth: 1080,
                  margin: '0 auto'
                }}
              >
                <div
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between'
                  }}
                >
                  <Typography.Title level={4} style={{ color: '#e5e7eb', margin: 0 }}>
                    酒店客房在线点单
                  </Typography.Title>
                  <Space align="center" size="middle">
                    <Typography.Text style={{ color: '#e5e7eb', fontSize: 13 }}>
                      {user.username}
                    </Typography.Text>
                    <Avatar
                      style={{ backgroundColor: '#0ea5e9', cursor: 'pointer' }}
                      size="large"
                      onClick={() => setView('profile')}
                    >
                      {initial}
                    </Avatar>
                    <Button size="small" onClick={handleLogout}>
                      退出
                    </Button>
                  </Space>
                </div>
              </Layout.Header>
              <Layout.Content style={{ padding: '8px' }}>
                <div style={{ maxWidth: 1080, margin: '0 auto', marginBottom: 72 }}>
                  {view === 'order' ? (
                    <OrderView user={user} API_BASE={API_BASE} initialRoom={query.room} />
                  ) : (
                    <ProfileView
                      user={user}
                      API_BASE={API_BASE}
                      onBack={() => setView('order')}
                      onUserUpdated={(u) => {
                        setUser((prev) => ({
                          ...prev,
                          username: u.username,
                          email: u.email
                        }));
                      }}
                    />
                  )}
                </div>
              </Layout.Content>
            </Layout>
          </ConfigProvider>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<AppShell />);
    </script>
  </body>
</html>
